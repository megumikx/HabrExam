<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Habr{% endblock %}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #ffffff;
            padding: 20px 50px;
            border-bottom: 1px solid #ddd;
        }

        header a {
            text-decoration: none;
            color: #333;
            margin-right: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <a href="{% url 'index' %}"><strong>HABR</strong></a>

    <a href="{% url 'index' %}">Главная</a>

    {% if user.is_authenticated %}
        <span>Привет, {{ user.username }}!</span>
        <a href="{% url 'logout' %}">Выйти</a>
    {% else %}
        <a href="{% url 'login' %}">Войти</a>
        <a href="{% url 'register' %}">Регистрация</a>
    {% endif %}
</header>


<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
