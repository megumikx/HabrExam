{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Habr{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <a href="{% url 'index' %}" class="logo">Хабр</a>

    <div class="nav-links">
        <a href="{% url 'index' %}">Главная</a>

        {% if user.is_authenticated %}
            <span>Привет, {{ user.username }}!</span>
            <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </div>
</header>

<div class="container">

    {% block content %}
    {% endblock %}

</div>
<aside>

    <h3>Навигация</h3>

    <ul>
        <li>
            <a href="{% url 'index' %}"><i class="fa-solid fa-house"></i>Главная</a>
        </li>

        <li>
            <a href="#"><i class="fa-solid fa-layer-group"></i>Категории</a>
        </li>

        <li>
            <a href="#"><i class="fa-solid fa-fire"></i>Популярное</a>
        </li>

        <li>
            <a href="#"><i class="fa-solid fa-star"></i>Избранное</a>
        </li>
    </ul>

</aside>
</body>
</html>
