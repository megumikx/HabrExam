{% extends 'layout.html' %}

{% block title %}Главная — Хабр{% endblock %}

{% block content %}

<h1>Последние новости</h1>

{% for article in news %}

<article class="news-card">

    <h2>
        <a href="{% url 'detail' article.pk %}">
            {{ article.title }}
        </a>
    </h2>

    <p>
        {{ article.anons }}
    </p>

</article>

{% empty %}

<p>Новостей пока нет.</p>

{% endfor %}

<a href="{% url 'news' %}">
    Смотреть все новости →
</a>

{% endblock %}
