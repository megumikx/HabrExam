{% extends 'layout.html' %}

{% block title %}Новости — Хабр{% endblock %}

{% block content %}

<h1>Новости</h1>

{% for el in news %}

    <article class="news-card">

        <h2>
            <a href="{% url 'detail' el.pk %}">
                {{ el.title }}
            </a>
        </h2>

        <p>{{ el.anons }}</p>

        <div class="news-card-footer">
            <a href="{% url 'detail' el.pk %}" class="news-link">
                Перейти на новость
            </a>

            <small>{{ el.data }}</small>
        </div>

    </article>

{% empty %}

    <p>Новостей пока нет.</p>

{% endfor %}

{% endblock %}
