{% extends 'main/layout.html' %}

{% block title %}Новости на сайте{% endblock %}

{% block content %}

<div class="content">

    <h1>Новости на сайте</h1>

    {% for el in news %}

        <div class="news-card">

            <h2>{{ el.title }}</h2>

            <p>{{ el.anons }}</p>

            <div class="news-footer">
                <span>{{ el.data|date:"d.m.Y" }}</span>

                <a href="#">
                    Читать далее →
                </a>
            </div>

        </div>

    {% endfor %}

</div>

{% endblock %}
