{% extends 'layout.html' %}

{% block title %}Категории — Хабр{% endblock %}

{% block content %}

<div class="categories-page">

    <h1>Категории</h1>

    <div class="categories-list">

        {% for category in categories %}
            <a href="{% url 'category-news' category.pk %}" class="category-card">
                {{ category.name }}
            </a>
        {% empty %}
            <p>Категорий пока нет.</p>
        {% endfor %}

    </div>

</div>

{% endblock %}
